<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>愛現大會．徵人公佈欄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --board: #7c5c3e;
        --paper: #fbf6ea;
        --paper-alt: #f3ecd8;
        --ink: #2b241a;
        --ink-soft: #5c5344;
        --line: rgba(43, 36, 26, 0.14);
        --pin: #b8b0a2;
        --music: #c94b3f;
        --music-bg: #f3d7cf;
        --dance: #1f8a79;
        --dance-bg: #cfe9e2;
        --drama: #6d4f99;
        --drama-bg: #e0d5ef;
        --other: #b9821f;
        --other-bg: #f2e2bd;
        --gold: #c9971f;
        --gold-bg: #f6e7bd;
        --shadow: 0 10px 24px rgba(30, 20, 8, 0.22);
      }
      :root:not([data-theme="light"]) {
        @media (prefers-color-scheme: dark) {
          --board: #3c2c1d;
          --paper: #eee5d2;
          --paper-alt: #e6dabd;
          --ink: #241d13;
        }
      }
      :root[data-theme="dark"] {
        --board: #3c2c1d;
        --paper: #eee5d2;
        --paper-alt: #e6dabd;
        --ink: #241d13;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(
            circle at 18% 22%,
            rgba(255, 255, 255, 0.05) 0,
            transparent 45%
          ),
          radial-gradient(
            circle at 82% 68%,
            rgba(0, 0, 0, 0.08) 0,
            transparent 50%
          ),
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.035) 0px,
            rgba(0, 0, 0, 0.035) 1px,
            transparent 1px,
            transparent 3px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.03) 0px,
            rgba(0, 0, 0, 0.03) 1px,
            transparent 1px,
            transparent 3px
          ),
          var(--board);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      .trial-banner {
        display: none;
        position: sticky;
        top: 0;
        z-index: 45;
        background: var(--gold-bg);
        color: #5a4416;
        font-size: 0.82rem;
        padding: 9px 16px;
        text-align: center;
        border-bottom: 1px solid rgba(90, 68, 22, 0.25);
      }
      .trial-banner b {
        margin-right: 4px;
      }
      .trial-banner button {
        font-family: inherit;
        border: none;
        background: #5a4416;
        color: #fff;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 700;
        cursor: pointer;
        margin-left: 8px;
      }

      header {
        padding: 34px 20px 20px;
        text-align: center;
      }
      .logo {
        font-family: "Noto Serif TC", serif;
        font-size: clamp(2.4rem, 6vw, 3.6rem);
        color: var(--paper);
        text-shadow: 2px 3px 0 rgba(0, 0, 0, 0.25);
        line-height: 1;
        margin: 0;
      }
      .tagline {
        color: var(--paper);
        opacity: 0.82;
        font-size: 0.95rem;
        margin: 10px auto 0;
        max-width: 540px;
        line-height: 1.7;
      }

      .top-btn {
        position: fixed;
        top: 16px;
        z-index: 40;
        background: var(--ink);
        color: var(--paper);
        border: none;
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        box-shadow: var(--shadow);
        transition: top 0.15s;
      }
      .top-btn:hover {
        filter: brightness(1.15);
      }
      #adminBtn {
        right: 16px;
      }
      #fbOpenBtn {
        left: 16px;
      }
      #rulesBtn {
        left: 126px;
      }

      .filters {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 20px 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }
      .chip-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .chip {
        font-family: inherit;
        border: 1.5px solid rgba(251, 246, 234, 0.55);
        background: transparent;
        color: var(--paper);
        padding: 7px 15px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.1s;
      }
      .chip:hover {
        transform: translateY(-1px);
      }
      .chip.active {
        background: var(--paper);
        color: var(--ink);
        border-color: var(--paper);
        font-weight: 700;
      }
      .chip.cat-active-音樂 {
        background: var(--music);
        border-color: var(--music);
        color: #fff;
      }
      .chip.cat-active-舞蹈 {
        background: var(--dance);
        border-color: var(--dance);
        color: #fff;
      }
      .chip.cat-active-戲劇 {
        background: var(--drama);
        border-color: var(--drama);
        color: #fff;
      }
      .chip.cat-active-其他 {
        background: var(--other);
        border-color: var(--other);
        color: #fff;
      }
      .chip.type-active-confirmed {
        background: var(--gold);
        border-color: var(--gold);
        color: #fff;
      }

      .board {
        max-width: 1180px;
        margin: 26px auto 120px;
        padding: 0 20px;
        columns: 3 280px;
        column-gap: 22px;
      }
      @media (max-width: 900px) {
        .board {
          columns: 2 260px;
        }
      }
      @media (max-width: 560px) {
        header {
          padding-top: 96px;
        }
        .top-btn {
          padding: 8px 11px;
          font-size: 0.74rem;
        }
        #fbOpenBtn {
          left: 10px;
          top: 12px;
        }
        #rulesBtn {
          left: 10px;
          top: 52px;
        }
        #adminBtn {
          right: 10px;
          top: 12px;
        }
        .board {
          columns: 1;
          padding: 0 16px;
        }
      }

      .card {
        break-inside: avoid;
        background: var(--paper);
        border-radius: 3px;
        padding: 20px 18px 16px;
        margin: 0 0 22px;
        box-shadow: var(--shadow);
        position: relative;
        display: block;
      }
      .card:nth-child(3n + 1) {
        transform: rotate(-1.1deg);
        background: var(--paper);
      }
      .card:nth-child(3n + 2) {
        transform: rotate(0.9deg);
        background: var(--paper-alt);
      }
      .card:nth-child(3n) {
        transform: rotate(-0.4deg);
        background: var(--paper);
      }
      .card:hover {
        transform: rotate(0deg) scale(1.015);
        z-index: 5;
        transition: transform 0.18s;
      }
      .card.confirmed {
        box-shadow:
          0 10px 24px rgba(30, 20, 8, 0.22),
          0 0 0 2px var(--gold) inset;
      }

      .pin {
        position: absolute;
        top: -9px;
        left: 50%;
        transform: translateX(-50%);
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #fff,
          var(--pin) 60%,
          #7a7264 100%
        );
        box-shadow: 0 3px 4px rgba(0, 0, 0, 0.35);
      }
      .tape {
        position: absolute;
        top: 4px;
        right: 14px;
        font-size: 0.68rem;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 3px;
        letter-spacing: 0.02em;
      }
      .tape.音樂 {
        background: var(--music-bg);
        color: var(--music);
      }
      .tape.舞蹈 {
        background: var(--dance-bg);
        color: var(--dance);
      }
      .tape.戲劇 {
        background: var(--drama-bg);
        color: var(--drama);
      }
      .tape.其他 {
        background: var(--other-bg);
        color: var(--other);
      }
      .ribbon {
        position: absolute;
        top: 4px;
        left: 14px;
        font-size: 0.68rem;
        font-weight: 900;
        padding: 3px 9px;
        border-radius: 3px;
        background: var(--gold-bg);
        color: #7a5c0e;
      }
      .kind-label {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--ink-soft);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 9px;
        margin: 14px 0 10px;
      }
      .diff-tag {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        color: #7a5c0e;
        background: var(--gold-bg);
        border-radius: 999px;
        padding: 2px 9px;
        margin: 14px 0 10px 6px;
      }
      .card h3 {
        font-size: 1.12rem;
        line-height: 1.4;
        margin: 0 0 8px;
        font-weight: 900;
        padding-right: 50px;
      }
      .card .who {
        font-size: 0.82rem;
        color: var(--ink-soft);
        margin-bottom: 10px;
      }
      .card .who b {
        color: var(--ink);
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .tag {
        font-size: 0.75rem;
        background: rgba(43, 36, 26, 0.08);
        padding: 3px 9px;
        border-radius: 5px;
        color: var(--ink);
      }
      .card p.desc {
        font-size: 0.87rem;
        line-height: 1.65;
        color: var(--ink);
        margin: 0 0 12px;
        white-space: pre-wrap;
      }
      .roster {
        margin: 0 0 12px;
        padding: 0;
        list-style: none;
      }
      .roster li {
        font-size: 0.85rem;
        padding: 4px 0;
        border-bottom: 1px dashed var(--line);
      }
      .roster li:last-child {
        border-bottom: none;
      }
      .card .contact {
        font-size: 0.82rem;
        background: rgba(43, 36, 26, 0.06);
        border-radius: 6px;
        padding: 7px 10px;
        margin-bottom: 10px;
      }
      .card .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        border-top: 1px dashed var(--line);
        padding-top: 8px;
        font-size: 0.72rem;
        color: var(--ink-soft);
      }
      .card .foot .btns {
        display: flex;
        gap: 10px;
      }
      .card .foot button {
        font-family: inherit;
        border: none;
        background: none;
        color: var(--music);
        font-weight: 700;
        cursor: pointer;
        font-size: 0.72rem;
        padding: 2px 2px;
      }
      .card .foot button.confirm {
        color: var(--dance);
      }

      .expand-btn {
        font-family: inherit;
        border: none;
        background: none;
        color: var(--ink-soft);
        font-weight: 700;
        font-size: 0.78rem;
        cursor: pointer;
        padding: 2px 0 10px;
        text-decoration: underline;
      }
      .expand-panel {
        margin-bottom: 2px;
      }

      .comments-block {
        margin-top: 8px;
      }
      .comments-toggle {
        font-family: inherit;
        border: none;
        background: none;
        color: var(--ink-soft);
        font-weight: 700;
        font-size: 0.78rem;
        cursor: pointer;
        padding: 6px 0 0;
      }
      .comments-panel {
        margin-top: 8px;
        background: rgba(43, 36, 26, 0.045);
        border-radius: 8px;
        padding: 10px;
      }
      .comment-item {
        font-size: 0.8rem;
        padding: 5px 0;
        border-bottom: 1px dashed var(--line);
        line-height: 1.5;
      }
      .comment-item:last-of-type {
        border-bottom: none;
      }
      .c-meta {
        font-size: 0.68rem;
        color: var(--ink-soft);
      }
      .c-empty {
        font-size: 0.78rem;
        color: var(--ink-soft);
        padding: 2px 0 6px;
      }
      .comment-form {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .comment-form input {
        flex: 1;
        min-width: 80px;
        font-family: inherit;
        font-size: 0.8rem;
        padding: 7px 9px;
        border: 1.5px solid var(--line);
        border-radius: 7px;
      }
      .comment-form button {
        font-family: inherit;
        border: none;
        background: var(--music);
        color: #fff;
        padding: 7px 13px;
        border-radius: 7px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        flex-shrink: 0;
      }

      .empty {
        color: var(--paper);
        text-align: center;
        opacity: 0.85;
        padding: 60px 20px;
        font-size: 0.95rem;
        line-height: 1.8;
      }

      .fab {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 30;
        background: var(--music);
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 15px 22px;
        font-family: inherit;
        font-weight: 900;
        font-size: 0.95rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .fab:hover {
        filter: brightness(1.08);
        transform: translateY(-2px);
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(20, 14, 6, 0.55);
        z-index: 50;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      @media (min-width: 640px) {
        .overlay {
          align-items: center;
          padding: 24px;
        }
      }
      .sheet {
        background: var(--paper);
        width: 100%;
        max-width: 540px;
        max-height: 92vh;
        overflow-y: auto;
        border-radius: 16px 16px 0 0;
        padding: 24px 22px 30px;
      }
      @media (min-width: 640px) {
        .sheet {
          border-radius: 14px;
        }
      }
      .sheet h2 {
        margin: 0 0 4px;
        font-size: 1.3rem;
      }
      .sheet .sub {
        font-size: 0.82rem;
        color: var(--ink-soft);
        margin-bottom: 18px;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 0.82rem;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .field input[type="text"],
      .field input[type="email"],
      .field textarea,
      .field select {
        width: 100%;
        font-family: inherit;
        font-size: 0.92rem;
        padding: 10px 12px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }
      .field textarea {
        resize: vertical;
        min-height: 70px;
      }
      .checkrow {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.86rem;
      }
      .checkrow input {
        width: 16px;
        height: 16px;
      }
      .toggle-row {
        display: flex;
        gap: 8px;
      }
      .toggle-row button {
        flex: 1;
        font-family: inherit;
        padding: 10px;
        border-radius: 8px;
        border: 1.5px solid var(--line);
        background: #fff;
        font-weight: 700;
        font-size: 0.88rem;
        cursor: pointer;
        color: var(--ink-soft);
      }
      .toggle-row button.active {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
      }
      .cat-pick {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .cat-pick button {
        font-family: inherit;
        border: 1.5px solid var(--line);
        background: #fff;
        padding: 7px 13px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
      }
      .cat-pick button.on.音樂 {
        background: var(--music);
        border-color: var(--music);
        color: #fff;
      }
      .cat-pick button.on.舞蹈 {
        background: var(--dance);
        border-color: var(--dance);
        color: #fff;
      }
      .cat-pick button.on.戲劇 {
        background: var(--drama);
        border-color: var(--drama);
        color: #fff;
      }
      .cat-pick button.on.其他 {
        background: var(--other);
        border-color: var(--other);
        color: #fff;
      }
      .tagbox {
        border: 1.5px solid var(--line);
        border-radius: 8px;
        padding: 7px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        background: #fff;
      }
      .tagbox input {
        border: none;
        outline: none;
        flex: 1;
        min-width: 90px;
        font-family: inherit;
        font-size: 0.85rem;
        padding: 4px;
      }
      .tagbox .tag {
        background: rgba(43, 36, 26, 0.08);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .tagbox .tag button {
        border: none;
        background: none;
        cursor: pointer;
        color: var(--ink-soft);
        font-size: 0.8rem;
      }
      .hint {
        font-size: 0.74rem;
        color: var(--ink-soft);
        margin-top: 5px;
      }
      .submit-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: var(--music);
        color: #fff;
        font-family: inherit;
        font-weight: 900;
        font-size: 0.98rem;
        cursor: pointer;
        margin-top: 6px;
      }
      .submit-btn.alt {
        background: var(--dance);
      }
      .submit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .close-x {
        position: absolute;
        top: 14px;
        right: 16px;
        background: none;
        border: none;
        font-size: 1.3rem;
        cursor: pointer;
        color: var(--ink-soft);
      }
      .sheet-wrap {
        position: relative;
      }
      .err {
        color: var(--music);
        font-size: 0.8rem;
        margin-top: 6px;
        min-height: 1em;
      }

      .roster-row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
        align-items: center;
      }
      .roster-row input {
        flex: 1;
        font-family: inherit;
        font-size: 0.85rem;
        padding: 8px 10px;
        border: 1.5px solid var(--line);
        border-radius: 7px;
      }
      .roster-row button {
        border: none;
        background: none;
        color: var(--music);
        font-size: 0.9rem;
        cursor: pointer;
      }
      .add-row-btn {
        font-family: inherit;
        border: 1.5px dashed var(--line);
        background: none;
        padding: 8px;
        width: 100%;
        border-radius: 8px;
        font-size: 0.82rem;
        color: var(--ink-soft);
        cursor: pointer;
        margin-bottom: 14px;
      }

      .admin-overlay {
        position: fixed;
        inset: 0;
        background: var(--paper);
        z-index: 60;
        overflow-y: auto;
      }
      .admin-inner {
        max-width: 960px;
        margin: 0 auto;
        padding: 26px 20px 60px;
      }
      .admin-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .admin-head h2 {
        margin: 0;
        font-size: 1.4rem;
      }
      .admin-head .head-btns {
        display: flex;
        gap: 8px;
      }
      .admin-close {
        background: var(--ink);
        color: var(--paper);
        border: none;
        padding: 8px 16px;
        border-radius: 999px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .admin-logout {
        background: none;
        color: var(--ink-soft);
        border: 1px solid var(--line);
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 22px;
      }
      .stat-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }
      .stat-card .n {
        font-size: 1.6rem;
        font-weight: 900;
      }
      .stat-card .l {
        font-size: 0.75rem;
        color: var(--ink-soft);
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 0.8rem;
      }
      .bar-row .label {
        width: 56px;
        flex-shrink: 0;
      }
      .bar-track {
        flex: 1;
        background: rgba(43, 36, 26, 0.08);
        border-radius: 6px;
        height: 10px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 6px;
      }
      .feedback-admin-list {
        display: grid;
        gap: 10px;
        margin-bottom: 24px;
      }
      .feedback-admin-item {
        background: rgba(43, 36, 26, 0.06);
        border: 1px solid var(--line);
        border-radius: 8px;

  <body>
    <button class="top-btn" id="adminBtn">後台管理</button>
    <button class="top-btn" id="fbOpenBtn">💬 留下回饋</button>

    <div class="filters">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (function () {
        const CATS = ["音樂", "戲劇", "舞蹈", "其他"];
        const CAT_COLOR = {
          舞蹈: "#1f8a79",
          音樂: "#c94b3f",
          戲劇: "#6d4f99",
          其他: "#b9821f",
        };
        const DIFFS = ["極易", "易", "普通", "難", "極難"];
        const SKILL_PRESETS = [
          "主唱",
          "和聲",
          "電吉他",
          "木吉他",
          "貝斯",
          "鼓",
          "鍵盤",
          "Cajon",
          "男舞",
          "女舞",
          "演員",
        ];
        const ADMIN_CODE = "IB19secret";

        // ===== 規則及注意事項：請直接修改下面這段文字 =====
        const RULES_CONTENT = `目前尚未設定規則內容。

夢的翅膀 已經受了傷`;
        // ===== 規則內容結束 =====
        const SUPABASE_URL = "https://tsijukpcbtkwwwgaqvrf.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY =
          "sb_publishable_DH6ib44CEg0a_gaVaToIUg_ks-0WoHN";
        const supabaseClient =
          window.supabase?.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
          ) || null;
        const postSecretHashes = new Map();

        let posts = [],
          subscribers = [],
          feedbacks = [],
          comments = [];
        let filterType = "all",
          filterCat = "all";
        let db = null,
          viewerId = null,
          adminUnlocked = false;
        const expandedComments = new Set();
        const unlockedPosts = new Set();
        const draftCName = {},
          draftCText = {};

        const boardEl = document.getElementById("board");
        const emptyEl = document.getElementById("emptyMsg");
        const typeFilterEl = document.getElementById("typeFilter");
        const catFilterEl = document.getElementById("catFilter");
        const adminBtn = document.getElementById("adminBtn");
        const fbOpenBtn = document.getElementById("fbOpenBtn");
        const rulesBtn = document.getElementById("rulesBtn");

        try {
          viewerId = localStorage.getItem("ib19_viewer_id");
          if (!viewerId) {
            viewerId =
              "u_" + Date.now() + "_" + Math.random().toString(36).slice(2);
            localStorage.setItem("ib19_viewer_id", viewerId);
          }
          adminUnlocked = localStorage.getItem("ib19_admin_ok") === "1";
        } catch (e) {
          viewerId = "u_" + Date.now();
        }

        function escapeHtml(s) {
          return String(s == null ? "" : s).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        }
        function timeAgo(ts) {
          const diff = Math.max(0, Date.now() - Number(ts || 0));
          const m = Math.floor(diff / 60000);
          if (m < 1) return "剛剛";
          if (m < 60) return m + " 分鐘前";
          const h = Math.floor(m / 60);
          if (h < 24) return h + " 小時前";
          const d = Math.floor(h / 24);
          if (d < 30) return d + " 天前";
          return new Date(ts).toLocaleDateString("zh-TW");
        }
        function toast(msg, ms) {
          const t = document.createElement("div");
          t.className = "toast";
          t.textContent = msg;
          document.body.appendChild(t);
          requestAnimationFrame(() => t.classList.add("show"));
          setTimeout(() => {
            t.classList.remove("show");
            setTimeout(() => t.remove(), 300);
          }, ms || 2200);
        }
        function arr(v) {
          return Array.isArray(v) ? v : v ? [v] : [];
        }
        function categoriesOf(p) {
          return arr(
            p.categories && p.categories.length ? p.categories : p.category,
          );
        }
        function rolesOf(p) {
          if (Array.isArray(p.roles) && p.roles.length)
            return p.roles.map((r) => ({
              role: r.role || "",
              qty: Math.max(1, Number(r.qty) || 1),
            }));
          return arr(p.tags).map((role) => ({ role, qty: 1 }));
        }
        function tagsOf(p) {
          return arr(p.tags);
        }
        function applicationsOf(p) {
          return Array.isArray(p.applications) ? p.applications : [];
        }
        function acceptedForRole(p, role) {
          return applicationsOf(p).filter(
            (a) => a.role === role && a.status === "accepted",
          );
        }
        function roleFilled(p, role) {
          const r = rolesOf(p).find((x) => x.role === role);
          return !!r && acceptedForRole(p, role).length >= r.qty;
        }
        function isFullyFilled(p) {
          return (
            p.type === "recruit" &&
            rolesOf(p).length > 0 &&
            rolesOf(p).every((r) => roleFilled(p, r.role))
          );
        }
        function displayTitle(p) {
          return p.type === "profile"
            ? p.name || "未命名"
            : p.title || "未命名徵人";
        }
        function normalizePost(p) {
          p.categories = categoriesOf(p);
          p.category = p.categories[0] || p.category || "其他";
          p.tags = tagsOf(p);
          p.roles = rolesOf(p);
          p.applications = applicationsOf(p);
          if (p.type === "profile") p.title = p.name || p.title || "";
          return p;
        }
        async function hashPassword(value) {
          const bytes = new TextEncoder().encode(value);
          if (window.crypto && crypto.subtle) {
            const digest = await crypto.subtle.digest("SHA-256", bytes);
            return Array.from(new Uint8Array(digest))
              .map((b) => b.toString(16).padStart(2, "0"))
              .join("");
          }
          let h = 0;
          for (const ch of value) h = ((h << 5) - h + ch.charCodeAt(0)) | 0;
          return "fallback_" + Math.abs(h);
        }
        function validPassword(v) {
          return /^\d{4}$/.test(v);
        }
        function safeUrl(v) {
          if (!v) return "";
          try {
            const u = new URL(v);
            return /^https?:$/.test(u.protocol) ? u.href : "";
          } catch (e) {
            return "";
          }
        }

        function renderBanner() {
          positionTopButtons();
        }
        function positionTopButtons() {
          const mobile = window.innerWidth <= 560;
          adminBtn.style.top = mobile ? "12px" : "16px";
          fbOpenBtn.style.top = mobile ? "12px" : "16px";
          rulesBtn.style.top = mobile ? "52px" : "16px";
        }
        window.addEventListener("resize", positionTopButtons);

        function renderFilters() {
          const typeChips = [
            { k: "all", label: "全部" },
            { k: "recruit", label: "找夥伴" },
            { k: "profile", label: "秀自己" },
            { k: "confirmed", label: "已成團" },
          ];
          typeFilterEl.innerHTML = typeChips
            .map(
              (c) =>
                `<button class="chip ${filterType === c.k ? "active" : ""} ${c.k === "confirmed" && filterType === c.k ? "type-active-confirmed" : ""}" data-type="${c.k}">${c.label}</button>`,
            )
            .join("");
          typeFilterEl.querySelectorAll("button").forEach(
            (b) =>
              (b.onclick = () => {
                filterType = b.dataset.type;
                renderFilters();
                renderBoard();
              }),
          );
          const catChips = [{ k: "all", label: "全部類別" }].concat(
            CATS.map((c) => ({ k: c, label: c })),
          );
          catFilterEl.innerHTML = catChips
            .map(
              (c) =>
                `<button class="chip ${filterCat === c.k ? "active" : ""} ${c.k !== "all" && filterCat === c.k ? "cat-active-" + c.k : ""}" data-cat="${c.k}">${c.label}</button>`,
            )
            .join("");
          catFilterEl.querySelectorAll("button").forEach(
            (b) =>
              (b.onclick = () => {
                filterCat = b.dataset.cat;
                renderFilters();
                renderBoard();
              }),
          );
        }

        function rolesHtml(p, owner) {
          const roles = rolesOf(p);
          if (!roles.length) return "";
          const extraRoleNames = [
            ...new Set(
              applicationsOf(p)
                .filter((a) => a.status !== "rejected" && a.role)
                .map((a) => a.role),
            ),
          ].filter((role) => !roles.some((r) => r.role === role));
          const displayRoles = roles.concat(
            extraRoleNames.map((role) => ({
              role,
              qty: Math.max(1, acceptedForRole(p, role).length),
            })),
          );
          return `<div class="role-list"><b>徵求位置</b>${displayRoles
            .map((r) => {
              const accepted = acceptedForRole(p, r.role);
              const pending = applicationsOf(p).filter(
                (a) => a.role === r.role && a.status === "pending",
              );
              const showPending = accepted.length < r.qty;
              const acceptedHtml = accepted
                .map(
                  (a) =>
                    `<div class="applicant-item accepted">✅ ${escapeHtml(r.role)}：<b>${escapeHtml(a.profileName || a.name || "未命名")}</b><span class="c-meta">（已確定）</span>${owner || a.applicantId === viewerId ? `<div class="applicant-actions">${owner ? `<button class="reject" data-app-reject="${p.id}" data-app-id="${a.id}" data-app-cancel="1">取消確定</button>` : ""}${a.applicantId === viewerId ? `<button class="reject" data-app-withdraw="${p.id}" data-app-id="${a.id}">我是本人，我要撤回應徵</button>` : ""}</div>` : ""}</div>`,
                )
                .join("");
              const pendingHtml = showPending
                ? pending
                    .map(
                      (a) =>
                        `<div class="applicant-item pending">🕒 ${escapeHtml(r.role)}：<b>${escapeHtml(a.profileName || a.name || "未命名")}</b>${owner || a.applicantId === viewerId ? `<div class="applicant-actions">${owner ? `<button class="accept" data-app-accept="${p.id}" data-app-id="${a.id}">確定這位</button><button class="reject" data-app-reject="${p.id}" data-app-id="${a.id}">不錄取</button>` : ""}${a.applicantId === viewerId ? `<button class="reject" data-app-withdraw="${p.id}" data-app-id="${a.id}">我是本人，我要撤回應徵</button>` : ""}</div>` : ""}</div>`,
                    )
                    .join("")
                : "";
              return `<div class="role-item"><div class="role-title">${escapeHtml(r.role)} × ${r.qty} <span class="c-meta">（已確定 ${accepted.length}/${r.qty}）</span></div>${acceptedHtml}${pendingHtml}${!accepted.length && !pending.length ? '<div class="c-empty">尚無應徵</div>' : ""}</div>`;
            })
            .join("")}</div>`;
        }

        function cardHtml(raw) {
          const p = normalizePost(raw);
          const owner = unlockedPosts.has(p.id);
          const confirmed = isFullyFilled(p);
          const cats = categoriesOf(p);
          const tagsHtml = tagsOf(p).length
            ? `<div class="tags">${tagsOf(p)
                .map((t) => `<span class="tag">${escapeHtml(t)}</span>`)
                .join("")}</div>`
            : "";
          const descHtml = p.description
            ? `<p class="desc">${escapeHtml(p.description)}</p>`
            : "";
          const refHtml = p.refUrl
            ? `<p class="desc">🔗 <a class="plain-link" href="${escapeHtml(p.refUrl)}" target="_blank" rel="noopener">參考連結</a></p>`
            : "";
          const comments = commentsFor(p.id);
          const cOpen = expandedComments.has(p.id);
          const commentsHtml = `<div class="comments-block"><button class="comments-toggle" data-ctoggle="${p.id}">💬 留言（${comments.length}） ${cOpen ? "▴" : "▾"}</button><div class="comments-panel" style="display:${cOpen ? "block" : "none"};">${comments.length ? comments.map((c) => `<div class="comment-item"><b>${escapeHtml(c.name || "匿名")}</b>：${escapeHtml(c.text)}<div class="c-meta">${timeAgo(c.createdAt)}</div></div>`).join("") : '<div class="c-empty">還沒有留言，第一個留言吧！</div>'}<div class="comment-form"><input type="text" data-cname="${p.id}" placeholder="稱呼（選填）" value="${escapeHtml(draftCName[p.id] || "")}"><input type="text" data-ctext="${p.id}" placeholder="留言…" value="${escapeHtml(draftCText[p.id] || "")}"><button data-csend="${p.id}">送出</button></div></div></div>`;
          const applicantButton =
            p.type === "recruit" && !confirmed
              ? `<button class="confirm" data-apply="${p.id}">🙋 我要應徵</button>`
              : "";
          const ownerButton = `<button class="manage-link" data-owner="${p.id}">${owner ? "✏️ 修改／刪除貼文" : "🔐 我是本人，我要修改資料"}</button>`;
          return `<div class="card ${confirmed ? "confirmed" : ""}" data-id="${escapeHtml(p.id)}"><div class="pin"></div><div class="tape ${escapeHtml(cats[0] || "其他")}">${escapeHtml(cats.join("・"))}</div>${confirmed ? '<div class="ribbon">🎉 已成團</div>' : ""}<span class="kind-label">${p.type === "recruit" ? "找夥伴" : "秀自己"}</span>${p.difficulty ? `<span class="diff-tag">難度：${escapeHtml(p.difficulty)}</span>` : ""}<h3>${escapeHtml(displayTitle(p))}</h3><div class="who">${p.type === "recruit" ? "發起人" : "自我介紹"}：<b>${escapeHtml(p.name)}</b></div>${p.type === "recruit" ? rolesHtml(p, owner) : tagsHtml}${descHtml}${refHtml}<div class="contact">📮 ${escapeHtml(p.contact)}</div>${p.type === "recruit" ? `<div class="app-summary">${applicationsOf(p).filter((a) => a.status === "pending").length ? "🕒 有 " + applicationsOf(p).filter((a) => a.status === "pending").length + " 位待處理應徵" : " "}</div>` : ""}${commentsHtml}<div class="foot"><span>${timeAgo(p.createdAt)}</span><div class="btns">${applicantButton}${ownerButton}</div></div></div>`;
        }
        function commentsFor(id) {
          return comments
            .filter((c) => c.postId === id)
            .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        }
        function renderBoard() {
          let list = posts
            .map(normalizePost)
            .slice()
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          if (filterType === "confirmed")
            list = list.filter(
              (p) => isFullyFilled(p) || p.status === "confirmed",
            );
          else if (filterType !== "all")
            list = list.filter((p) => p.type === filterType);
          if (filterCat !== "all")
            list = list.filter((p) => categoriesOf(p).includes(filterCat));
          if (!list.length) {
            boardEl.innerHTML = "";
            emptyEl.style.display = "block";
            emptyEl.textContent = posts.length
              ? "這個篩選條件下還沒有貼文。"
              : "公佈欄還空空的，當第一個貼文的人吧！";
          } else {
            emptyEl.style.display = "none";
            boardEl.innerHTML = list.map(cardHtml).join("");
          }
        }

        boardEl.addEventListener("click", async (e) => {
          const ctoggle = e.target.closest("[data-ctoggle]");
          if (ctoggle) {
            const id = ctoggle.dataset.ctoggle;
            expandedComments.has(id)
              ? expandedComments.delete(id)
              : expandedComments.add(id);
            renderBoard();
            return;
          }
          const send = e.target.closest("[data-csend]");
          if (send) {
            await sendComment(send.dataset.csend);
            return;
          }
          const owner = e.target.closest("[data-owner]");
          if (owner) {
            const p = posts.find((x) => x.id === owner.dataset.owner);
            if (p) requestOwnerAction(p);
            return;
          }
          const apply = e.target.closest("[data-apply]");
          if (apply) {
            const p = posts.find((x) => x.id === apply.dataset.apply);
            if (p) openApplyModal(p);
            return;
          }
          const accept = e.target.closest("[data-app-accept]");
          if (accept) {
            const p = posts.find((x) => x.id === accept.dataset.appAccept);
            if (p) changeApplication(p, accept.dataset.appId, "accepted");
            return;
          }
          const withdraw = e.target.closest("[data-app-withdraw]");
          if (withdraw) {
            const p = posts.find((x) => x.id === withdraw.dataset.appWithdraw);
            if (p) withdrawApplication(p, withdraw.dataset.appId);

          }
          const reject = e.target.closest("[data-app-reject]");
          if (reject) {
            const p = posts.find((x) => x.id === reject.dataset.appReject);
            if (p)
              changeApplication(

                reject.dataset.appCancel === "1"

              );
            return;

              document.getElementById("pwErr").textContent = "請輸入四位數字";
              return;

            try {
              const hash = await hashPassword(pw);
              let valid = false;
              if (post.passwordHash) {
                valid = hash === post.passwordHash;
              } else if (db.verifyPostPassword) {
                valid = await db.verifyPostPassword(post.id, hash);
              } else {
                document.getElementById("pwErr").textContent =
                  "這則貼文沒有可用的密碼驗證資料";
                return;
              }
              if (!valid) {

              closeModal();
              unlockedPosts.add(post.id);
              callback();

        async function withdrawApplication(post, appId) {
          const target = applicationsOf(post).find((a) => a.id === appId);
          const profile = target
            ? posts.find(
                (p) => p.id === target.profileId && p.type === "profile",
              )

              post.id,

            );

            await triggerUpdate();

            toast("撤回失敗：" + (e.message || "請稍後再試"));
          }

        async function changeApplication(post, appId, status) {
          if (!unlockedPosts.has(post.id)) {
            passwordModal(post, () => changeApplication(post, appId, status));
            return;
          }
          const apps = applicationsOf(post).map((a) => {
            if (a.id !== appId) return a;
            if (status === "accepted") {
              return Object.assign({}, a, {
                status: "accepted",
                previousStatus: a.status || "pending",
              });
            }
            if (status === "cancel_accepted") {
              const restored = Object.assign({}, a, {
                status: a.previousStatus || "pending",
              });
              delete restored.previousStatus;
              return restored;
            }
            const rejected = Object.assign({}, a, { status: "rejected" });
            delete rejected.previousStatus;
            return rejected;
          });
          const p = posts.find((x) => x.id === post.id);
          const next = Object.assign({}, p, { applications: apps });
          const roles = rolesOf(next);
          for (const r of roles) {
            const accepted = apps.filter(
              (a) => a.role === r.role && a.status === "accepted",
            );
            if (accepted.length > r.qty) {
              toast("這個位置的人數已滿");
              return;
            }
          }
          try {
            await db
              .collection("posts")
              .doc(post.id)
              .update({
                applications: apps,
                status: isFullyFilled(next) ? "confirmed" : "open",
                roster: apps
                  .filter((a) => a.status === "accepted")
                  .map((a) => ({
                    role: a.role,
                    name: a.profileName,
                    profileId: a.profileId,
                  })),
              });
            toast(
              status === "accepted" ? "已確定這位應徵者" : "已更新應徵狀態",
            );
            triggerUpdate();
          } catch (e) {
            toast("更新應徵失敗：" + e.message);
          }
        }

        function openRules() {
          const root = document.getElementById("rulesRoot");
          root.innerHTML = `<div class="overlay" id="rulesOvl"><div class="sheet rules-sheet"><div class="sheet-wrap"><button class="close-x" id="rulesClose">✕</button><h2>規則及注意事項</h2><p class="sub">有任何疑問歡迎私訊幹部詢問</p><div class="rules-empty">${escapeHtml(RULES_CONTENT).replace(/\n/g, "<br>")}</div></div></div></div>`;
          document.getElementById("rulesClose").onclick = () =>
            (root.innerHTML = "");
          document.getElementById("rulesOvl").onclick = (e) => {
            if (e.target.id === "rulesOvl") root.innerHTML = "";
          };
        }
        rulesBtn.onclick = openRules;

        function openFeedbackModal() {
          const root = document.getElementById("modalRoot");
          root.innerHTML = `<div class="overlay" id="fbOvl"><div class="sheet"><div class="sheet-wrap"><button class="close-x" id="fbClose">✕</button><h2>留下回饋</h2><p class="sub">有任何想法都歡迎告訴我們。</p><div class="field"><label>回饋內容</label><textarea id="fbText" maxlength="500" placeholder="哪裡不好用？希望增加什麼功能？"></textarea></div><div class="field"><label>聯絡方式（選填）</label><input type="text" id="fbContact" maxlength="100" placeholder="Email、IG 或其他方式"></div><div class="err" id="fbErr"></div><button class="submit-btn" id="fbSubmit">送出回饋</button></div></div></div>`;
          document.getElementById("fbClose").onclick = closeModal;
          document.getElementById("fbOvl").onclick = (e) => {
            if (e.target.id === "fbOvl") closeModal();
          };
          document.getElementById("fbSubmit").onclick = async () => {
            const text = document.getElementById("fbText").value.trim();
            const contact = document.getElementById("fbContact").value.trim();
            const err = document.getElementById("fbErr");
            if (!text) {
              err.textContent = "請先寫下回饋內容";
              return;
            }
            const btn = document.getElementById("fbSubmit");
            btn.disabled = true;
            btn.textContent = "送出中…";
            try {
              await db
                .collection("feedback")
                .add({ text, contact, createdAt: Date.now() });
              closeModal();
              toast("🙏 已收到你的回饋！");
              triggerUpdate();
            } catch (e) {
              console.error("回饋送出失敗：", e);
              err.textContent = "送出失敗：" + e.message;
              btn.disabled = false;
              btn.textContent = "送出回饋";
            }
          };
        }
        fbOpenBtn.onclick = openFeedbackModal;

        function openAdminAuth() {
          const root = document.getElementById("modalRoot");
          root.innerHTML = `<div class="overlay" id="apOvl"><div class="sheet" style="max-width:380px"><div class="sheet-wrap"><button class="close-x" id="apClose">✕</button><h2>後台授權</h2><p class="sub">請輸入授權碼才能進入後台。</p><div class="field"><input type="password" id="apCode" placeholder="授權碼" autocomplete="off"></div><div class="err" id="apErr"></div><button class="submit-btn" id="apSubmit">進入後台</button></div></div></div>`;
          document.getElementById("apClose").onclick = closeModal;
          document.getElementById("apOvl").onclick = (e) => {
            if (e.target.id === "apOvl") closeModal();
          };
          const submit = () => {
            if (document.getElementById("apCode").value === ADMIN_CODE) {
              adminUnlocked = true;
              try {
                localStorage.setItem("ib19_admin_ok", "1");
              } catch (e) {}
              closeModal();
              openAdmin();
            } else document.getElementById("apErr").textContent = "授權碼錯誤";
          };
          document.getElementById("apSubmit").onclick = submit;
          document.getElementById("apCode").onkeydown = (e) => {
            if (e.key === "Enter") submit();
          };
        }
        adminBtn.onclick = () =>
          adminUnlocked ? openAdmin() : openAdminAuth();
        function openAdmin() {
          const root = document.getElementById("adminRoot"),
            list = posts
              .slice()
              .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)),
            recruitCount = list.filter((p) => p.type === "recruit").length,
            profileCount = list.filter((p) => p.type === "profile").length,
            confirmedList = list.filter(isFullyFilled);
          root.innerHTML = `<div class="admin-overlay"><div class="admin-inner"><div class="admin-head"><h2>後台</h2><div class="head-btns"><button class="admin-logout" id="aLogout">登出後台</button><button class="admin-close" id="aClose">回到公佈欄</button></div></div><div class="stat-grid"><div class="stat-card"><div class="n">${list.length}</div><div class="l">總貼文數</div></div><div class="stat-card"><div class="n">${recruitCount}</div><div class="l">找夥伴</div></div><div class="stat-card"><div class="n">${profileCount}</div><div class="l">秀自己</div></div><div class="stat-card"><div class="n">${confirmedList.length}</div><div class="l">已成團</div></div><div class="stat-card"><div class="n">${comments.length}</div><div class="l">總留言數</div></div></div><div class="section-title">使用者回饋</div><div class="feedback-admin-list">${
            feedbacks.length
              ? feedbacks
                  .slice()
                  .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
                  .map(
                    (f) =>
                      `<div class="feedback-admin-item"><div class="feedback-admin-meta">${new Date(f.createdAt || 0).toLocaleString("zh-TW")}${f.contact ? ` ・ ${escapeHtml(f.contact)}` : ""}</div><div class="feedback-admin-text">${escapeHtml(f.text)}</div></div>`,
                  )
                  .join("")
              : "目前還沒有回饋"
          }</div><div class="section-title">全部貼文明細</div><div class="scrollx"><table class="admin-table"><thead><tr><th>狀態</th><th>類型</th><th>類別</th><th>標題／名稱</th><th>聯絡方式</th><th>角色／技能</th><th>應徵數</th><th>張貼時間</th><th></th></tr></thead><tbody>${list.length ? list.map((p) => `<tr><td>${isFullyFilled(p) ? "已成團" : "開放中"}</td><td>${p.type === "recruit" ? "找夥伴" : "秀自己"}</td><td>${escapeHtml(categoriesOf(p).join("、"))}</td><td>${escapeHtml(displayTitle(p))}</td><td>${escapeHtml(p.contact)}</td><td>${escapeHtml((p.type === "recruit" ? rolesOf(p).map((r) => r.role + "×" + r.qty) : tagsOf(p)).join("、"))}</td><td>${applicationsOf(p).length}</td><td>${new Date(p.createdAt || 0).toLocaleString("zh-TW")}</td><td><button class="del-btn" data-id="${p.id}">刪除</button></td></tr>`).join("") : '<tr><td colspan="9">目前沒有貼文</td></tr>'}</tbody></table></div></div></div>`;
          document.getElementById("aClose").onclick = () =>
            (root.innerHTML = "");
          document.getElementById("aLogout").onclick = () => {
            adminUnlocked = false;
            try {
              localStorage.removeItem("ib19_admin_ok");
            } catch (e) {}
            root.innerHTML = "";
          };
          root.querySelectorAll(".del-btn").forEach(
            (b) =>
              (b.onclick = async () => {
                if (confirm("確定刪除嗎？")) {
                  try {
                    await db.adminDeletePost(b.dataset.id, ADMIN_CODE);
                    toast("已刪除");
                    await triggerUpdate();
                    openAdmin();
                  } catch (e) {
                    console.error("後台刪除失敗：", e);
                    toast("刪除失敗：請確認管理員刪除 SQL 已執行");
                  }
                }
              }),
          );
        }

        // Supabase adapter. If the network is unavailable, the page falls back to localStorage.
        (function init() {
          const memoryStore = {};
          function readStore(name) {
            try {
              const raw = localStorage.getItem(name);
              const v = raw ? JSON.parse(raw) : memoryStore[name] || [];
              return Array.isArray(v) ? v : [];
            } catch (e) {
              return Array.isArray(memoryStore[name])
                ? memoryStore[name].slice()
                : [];
            }
          }
          function writeStore(name, value) {
            memoryStore[name] = value.slice();
            try {
              localStorage.setItem(name, JSON.stringify(value));
            } catch (e) {}
          }
          const remote = !!supabaseClient;
          const localAdapter = {
            collection(name) {
              return {
                add: async (data) => {
                  const id =
                    Date.now() + "_" + Math.random().toString(36).slice(2, 8);
                  const doc = Object.assign({ id }, data);
                  const a = readStore(name);
                  a.push(doc);
                  writeStore(name, a);
                  return { id };
                },
                get: async () => ({
                  docs: readStore(name).map((x) => ({
                    id: x.id,
                    data: () => x,
                  })),
                }),
                doc(id) {
                  return {
                    set: async (data) => {
                      let a = readStore(name),
                        i = a.findIndex((x) => x.id === id);
                      if (i < 0) a.push(Object.assign({ id }, data));
                      else a[i] = Object.assign({}, a[i], data);
                      writeStore(name, a);
                    },
                    update: async (data) => {
                      let a = readStore(name),
                        i = a.findIndex((x) => x.id === id);
                      if (i >= 0) {
                        a[i] = Object.assign({}, a[i], data);
                        writeStore(name, a);
                      }
                    },
                    delete: async () => {
                      writeStore(
                        name,
                        readStore(name).filter((x) => x.id !== id),
                      );
                    },
                  };
                },
              };
            },
            adminDeletePost: async (id) => {
              writeStore(
                "posts",
                readStore("posts").filter((x) => x.id !== id),
              );
            },
            applyToPost: async (id, application) => {
              const a = readStore("posts");
              const i = a.findIndex((x) => x.id === id);
              if (i < 0) throw new Error("post not found");
              const apps = Array.isArray(a[i].applications)
                ? a[i].applications
                : [];
              if (
                apps.some(
                  (x) =>
                    x.role === application.role &&
                    x.profileId === application.profileId &&
                    x.status !== "rejected",
                )
              )
                throw new Error("你已經應徵這個位置了");
              a[i] = Object.assign({}, a[i], {
                applications: apps.concat(application),
                updatedAt: Date.now(),
              });
              writeStore("posts", a);
            },
            withdrawApplication: async (id, appId, profileId, hash) => {
              const a = readStore("posts");
              const i = a.findIndex((x) => x.id === id);
              if (i < 0) throw new Error("post not found");
              const apps = Array.isArray(a[i].applications)
                ? a[i].applications
                : [];
              const target = apps.find((x) => x.id === appId);
              const profile = readStore("posts").find(
                (x) => x.id === profileId && x.type === "profile",
              );
              if (
                !target ||
                target.profileId !== profileId ||
                !profile ||
                profile.passwordHash !== hash
              )
                throw new Error("個人資料密碼錯誤");
              a[i] = Object.assign({}, a[i], {
                applications: apps.filter((x) => x.id !== appId),
                updatedAt: Date.now(),
              });
              writeStore("posts", a);
            },
            verifyPostPassword: async (id, hash) => {
              const p = readStore("posts").find((x) => x.id === id);
              return !!p && p.passwordHash === hash;
            },
          };
          function toDbPost(data) {
            return {
              id: data.id,
              type: data.type,
              categories: data.categories || [],
              category: data.category || "",
              title: data.title || "",
              name: data.name || "",
              contact: data.contact || "",
              difficulty: data.difficulty || "",
              tags: data.tags || [],
              roles: data.roles || [],
              description: data.description || "",
              refUrl: data.refUrl || "",
              status: data.status || "open",
              authorId: data.authorId || null,
              applications: data.applications || [],
              roster: data.roster || [],
              finalNote: data.finalNote || "",
              createdAt: data.createdAt || Date.now(),
              updatedAt: data.updatedAt || Date.now(),
            };
          }
          function fromDbPost(row) {
            return normalizePost({
              id: row.id,
              type: row.type,
              categories: row.categories || [],
              category: row.category,
              title: row.title,
              name: row.name,
              contact: row.contact,
              difficulty: row.difficulty || "",
              tags: row.tags || [],
              roles: row.roles || [],
              description: row.description || "",
              refUrl: row.ref_url || "",
              status: row.status || "open",
              authorId: row.author_id,
              applications: row.applications || [],
              roster: row.roster || [],
              finalNote: row.final_note || "",
              createdAt: Number(row.created_at || 0),
              updatedAt: Number(row.updated_at || 0),
            });
          }
          function fromDbComment(row) {
            return {
              id: row.id,
              postId: row.post_id,
              name: row.name || "",
              text: row.text || "",
              authorId: row.author_id,
              createdAt: Number(row.created_at || 0),
            };
          }
          function fromDbFeedback(row) {
            return {
              id: row.id,
              text: row.text || "",
              contact: row.contact || "",
              createdAt: Number(row.created_at || 0),
            };
          }
          if (remote) {
            db = {
              async verifyPostPassword(id, hash) {
                const { data, error } = await supabaseClient.rpc(
                  "verify_post_secret",
                  { p_post_id: id, p_password_hash: hash },
                );
                if (error) throw error;
                return data === true;
              },
              async adminDeletePost(id, code) {
                const { data, error } = await supabaseClient.rpc(
                  "admin_delete_post",
                  { p_post_id: id, p_admin_code: code },
                );
                if (error) throw error;
                if (data !== true) throw new Error("admin delete rejected");
              },
              async applyToPost(id, application) {
                const { error } = await supabaseClient.rpc("apply_to_post", {
                  p_post_id: id,
                  p_application: application,
                });
                if (error) throw error;
              },
              async withdrawApplication(id, appId, profileId, hash) {
                const { error } = await supabaseClient.rpc(
                  "withdraw_application",
                  {
                    p_post_id: id,
                    p_application_id: appId,
                    p_profile_id: profileId,
                    p_password_hash: hash,
                  },
                );
                if (error) throw error;
              },
              collection(name) {
                if (name === "posts")
                  return {
                    add: async (data) => {
                      const { data: row, error } = await supabaseClient.rpc(
                        "create_post_with_secret",
                        {
                          p_post: toDbPost(data),
                          p_password_hash: data.passwordHash || "",
                        },
                      );
                      if (error) throw error;
                      return { id: row.id };
                    },
                    get: async () => {
                      const { data, error } = await supabaseClient
                        .from("posts")
                        .select("*")
                        .order("created_at", { ascending: false });
                      if (error) throw error;
                      return {
                        docs: (data || []).map((row) => ({
                          id: row.id,
                          data: () => fromDbPost(row),
                        })),
                      };
                    },
                    doc: (id) => ({
                      update: async (data) => {
                        const hash =
                          data.passwordHash || postSecretHashes.get(id) || "";
                        const current = posts.find((x) => x.id === id) || {
                          id,
                        };
                        const { error } = await supabaseClient.rpc(
                          "update_post_with_secret",
                          {
                            p_post_id: id,
                            p_post: toDbPost(
                              Object.assign({}, current, data, { id }),
                            ),
                            p_password_hash: hash,
                          },
                        );
                        if (error) throw error;
                      },
                      set: async (data) => {
                        const hash =
                          data.passwordHash || postSecretHashes.get(id) || "";
                        const current = posts.find((x) => x.id === id) || {
                          id,
                        };
                        const { error } = await supabaseClient.rpc(
                          "update_post_with_secret",
                          {
                            p_post_id: id,
                            p_post: toDbPost(
                              Object.assign({}, current, data, { id }),
                            ),
                            p_password_hash: hash,
                          },
                        );
                        if (error) throw error;
                      },
                      delete: async () => {
                        const hash = postSecretHashes.get(id) || "";
                        const { error } = await supabaseClient.rpc(
                          "delete_post_with_secret",
                          { p_post_id: id, p_password_hash: hash },
                        );
                        if (error) throw error;
                      },
                    }),
                  };
                if (name === "comments")
                  return {
                    add: async (data) => {
                      const row = {
                        id:
                          data.id ||
                          "c_" +
                            Date.now() +
                            "_" +
                            Math.random().toString(36).slice(2, 7),
                        post_id: data.postId,
                        name: data.name || "",
                        text: data.text,
                        author_id: data.authorId || null,
                        created_at: data.createdAt || Date.now(),
                      };
                      const { error } = await supabaseClient
                        .from("comments")
                        .insert(row);
                      if (error) throw error;
                      return { id: row.id };
                    },
                    get: async () => {
                      const { data, error } = await supabaseClient
                        .from("comments")
                        .select("*")
                        .order("created_at", { ascending: true });
                      if (error) throw error;
                      return {
                        docs: (data || []).map((row) => ({
                          id: row.id,
                          data: () => fromDbComment(row),
                        })),
                      };
                    },
                  };
                if (name === "feedback")
                  return {
                    add: async (data) => {
                      const row = {
                        id:
                          "f_" +
                          Date.now() +
                          "_" +
                          Math.random().toString(36).slice(2, 7),
                        text: data.text,
                        contact: data.contact || "",
                        created_at: data.createdAt || Date.now(),
                      };
                      const { error } = await supabaseClient
                        .from("feedback")
                        .insert(row);
                      if (error) throw error;
                      return { id: row.id };
                    },
                    get: async () => {
                      const { data, error } = await supabaseClient.rpc(
                        "admin_get_feedback",
                        { p_admin_code: ADMIN_CODE },
                      );
                      if (error) throw error;
                      return {
                        docs: (data || []).map((row) => ({
                          id: row.id,
                          data: () => fromDbFeedback(row),
                        })),
                      };
                    },
                  };
                return localAdapter.collection(name);
              },
            };
          } else db = localAdapter;
          window.addEventListener("storage", () => triggerUpdate());
          if (remote) {
            supabaseClient
              .channel("aixian-live")
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "posts" },
                () => triggerUpdate(),
              )
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "comments" },
                () => triggerUpdate(),
              )
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "feedback" },
                () => triggerUpdate(),
              )
              .subscribe();
          }
        })();
        async function triggerUpdate() {
          try {
            if (supabaseClient) {
              const pSnap = await db.collection("posts").get();
              posts = pSnap.docs.map((d) => d.data());
              const cSnap = await db.collection("comments").get();
              comments = cSnap.docs.map((d) => d.data());
              try {
                const fSnap = await db.collection("feedback").get();
                feedbacks = fSnap.docs.map((d) => d.data());
              } catch (feedbackError) {
                console.warn(
                  "回饋資料暫時無法讀取；貼文仍使用 Supabase：",
                  feedbackError,
                );
                feedbacks = [];
              }
            } else {
              posts = readStoreSafe("posts").map(normalizePost);
              comments = readStoreSafe("comments");
            }
            subscribers = readStoreSafe("subscribers");
            if (!supabaseClient) feedbacks = readStoreSafe("feedback");
            renderFilters();
            renderBoard();
            renderBanner();
          } catch (e) {
            console.error("雲端資料讀取失敗，改用本機資料：", e);
            posts = readStoreSafe("posts").map(normalizePost);
            comments = readStoreSafe("comments");
            renderFilters();
            renderBoard();
            renderBanner();
          }
        }
        function readStoreSafe(name) {
          try {
            const v = JSON.parse(localStorage.getItem(name) || "[]");
            return Array.isArray(v) ? v : [];
          } catch (e) {
            return [];
          }
        }
        renderFilters();
        renderBoard();
        renderBanner();
        triggerUpdate();
      })();
    </script>
  </body>
